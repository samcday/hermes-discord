[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64

[Output]
Format=disk
Output=hermes-voice
OutputDirectory=mkosi.output
CompressOutput=no
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
UnifiedKernelImages=unsigned
KernelCommandLine=root=PARTUUID rw console=tty0 console=ttyS0,115200n8 systemd.ssh_auto=no systemd.firstboot=no
Locale=C.UTF-8
Timezone=UTC
Hostname=hermes-voice
RootPassword=hashed:!
Autologin=no
Ssh=never
SELinuxRelabel=yes
WithDocs=no
WithRecommends=no
Packages=systemd
         systemd-udev
         systemd-networkd
         systemd-resolved
         systemd-boot
         kernel-core
         kernel-modules
         dbus-broker
         bash
         coreutils
         e2fsprogs
         util-linux
         shadow-utils
         iproute
         procps-ng
         git-core
         curl
         ca-certificates
         tar
         gzip
         xz
         gawk
         grep
         sed
         findutils
         openssh-server
         openssh-clients
         libatomic
         libstdc++
         libgomp
         opus
         gcc
         gcc-c++
         make
         pkgconf-pkg-config
         selinux-policy-targeted
         policycoreutils

[Validation]
SecureBoot=no

[Build]
RepartOffline=yes
History=no
CacheDirectory=mkosi.cache
Incremental=yes
